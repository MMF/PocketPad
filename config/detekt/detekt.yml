# Overrides on top of detekt's default configuration (--build-upon-default-config).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  CyclomaticComplexMethod:
    # State-machine transition tables are a flat `when`; count only non-trivial branches.
    ignoreSimpleWhenEntries: true
  LongMethod:
    # Compose UI functions are declarative layout and grow long without growing complex.
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 8
    ignoreDefaultParameters: true
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Preview']
    # ReportSender and HidSessionController each wrap one state machine with many small
    # private helpers; splitting them further would scatter the state they share.
    thresholdInClasses: 32
    # SessionMachine is one transition function split into small named helpers.
    thresholdInObjects: 16

style:
  MagicNumber:
    # Enum entries carry spec-defined values (HID usage IDs, report bit masks).
    ignoreEnums: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Preview']
    excludes: ['**/test/**', '**/testFixtures/**', '**/androidTest/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  MaxLineLength:
    maxLineLength: 120
