name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The Gradle daemon is pinned to JDK 17 (gradle/gradle-daemon-jvm.properties);
      # Gradle auto-detects the JDK this step installs. The runner image ships the Android SDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Format (ktlint via Spotless)
        run: ./gradlew spotlessCheck

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Unit tests
        run: ./gradlew test

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            build/reports/
            */build/reports/
            */build/test-results/
          if-no-files-found: ignore
